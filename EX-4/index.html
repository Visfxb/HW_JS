<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW-12-4</title>
    <style>
        #card-container{
            display: flex;
            flex-wrap: wrap;
        }
        .card{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 20px;
            width: 200px;
            height: 275px;
            padding: 10px;
        }
        .card img{
            width: 100%;
            height: 95%;
        }
        #input{
            width: 200px;
            height: 25px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <input type="text" id="input" placeholder="Введіть назву">

    <div id="card-container">
        <div class="card" data-name="Перша гора 1">
            <img src="../images/1.jfif" alt="1">
            <p>Перша гора 1</p>
        </div>

        <div class="card" data-name="Друга гора 2">
            <img src="../images/2.jfif" alt="2">
            <p>Друга гора 2</p>
        </div>
        
        <div class="card" data-name="Третя гора 1">
            <img src="../images/3.jfif" alt="3">
            <p>Третя гора 1</p>
        </div>
        
        <div class="card" data-name="Четверта гора 3">
            <img src="../images/4.jfif" alt="4">
            <p>Четверта гора 3</p>
        </div>
        
        <div class="card" data-name="П'ята гора 2">
            <img src="../images/5.jfif" alt="5">
            <p>П'ята гора 2</p>
        </div>
        
        <div class="card" data-name="Шоста гора 2">
            <img src="../images/6.jfif" alt="6">
            <p>Шоста гора 2</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
